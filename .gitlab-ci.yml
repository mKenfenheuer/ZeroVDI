before_script:
  - export CI_ENVIRONMENT_HOST=$(echo $CI_ENVIRONMENT_URL | sed 's~http[s]*://~~g')

stages:
 - build
 - deploy

build_amd64_image:
  stage: build
  needs:
    - job: build_desktop_windows_linux
      optional: true
    - job: build_desktop_macos
      optional: true
  rules:
    - changes:
        - KSol.ZeroVDI/**/*
  tags:
    - docker
    - build
    - shell
  script:
    # Desktop client installers are no longer built on every pipeline (see build_desktop_*
    # jobs' `rules: changes`). Instead, pull the latest already-published installers from the
    # generic package registry so the dashboard can always offer a download, independent of
    # whether this pipeline touched the desktop client.
    - mkdir -p KSol.ZeroVDI/wwwroot/downloads
    - 'curl --fail --location --header "JOB-TOKEN: $CI_JOB_TOKEN" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/desktop-client/latest/ZeroVDI-Setup-Windows.exe" -o KSol.ZeroVDI/wwwroot/downloads/ZeroVDI-Setup-Windows.exe'
    - 'curl --fail --location --header "JOB-TOKEN: $CI_JOB_TOKEN" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/desktop-client/latest/ZeroVDI-Linux.AppImage" -o KSol.ZeroVDI/wwwroot/downloads/ZeroVDI-Linux.AppImage'
    - 'curl --fail --location --header "JOB-TOKEN: $CI_JOB_TOKEN" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/desktop-client/latest/ZeroVDI-macOS.dmg" -o KSol.ZeroVDI/wwwroot/downloads/ZeroVDI-macOS.dmg || true'
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $CI_COMMIT_BRANCH .
    - docker image tag $CI_COMMIT_BRANCH $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker image tag $CI_COMMIT_BRANCH $CI_REGISTRY_IMAGE:latest
    - docker image push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker image push $CI_REGISTRY_IMAGE:latest
    - docker image prune -a

# ZeroVDI connector agent image, published under the /connector path of the registry so it versions
# alongside the gateway (same short-SHA tag).
build_connector_image:
  stage: build
  rules:
    - changes:
        - KSol.ZeroVDI.Desktop/**/*
  tags:
    - docker
    - build
    - shell
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -f KSol.ZeroVDI.Connector/Dockerfile -t $CI_REGISTRY_IMAGE/connector:$CI_COMMIT_SHORT_SHA .
    - docker build -f KSol.ZeroVDI.Connector/Dockerfile -t $CI_REGISTRY_IMAGE/connector:latest .
    - docker image push $CI_REGISTRY_IMAGE/connector:$CI_COMMIT_SHORT_SHA
    - docker image push $CI_REGISTRY_IMAGE/connector:latest
    - docker image prune -a

# Desktop client (Electron wrapper around the web console). Windows and Linux targets are built
# cross-platform via electron-builder on the existing Linux runner; macOS needs Apple's own
# tooling (codesign/hdiutil) so it runs on the macOS runner instead. Only runs when files under
# KSol.ZeroVDI.Desktop change, so unrelated pipelines don't pay for an Electron rebuild. Installers
# are pushed to the generic package registry under the `latest` version so build_amd64_image (and
# anyone else) can grab the newest build without needing this job to have run.
build_desktop_windows_linux:
  stage: build
  rules:
    - changes:
        - KSol.ZeroVDI.Desktop/**/*
  tags:
    - docker
    - build
    - dind
  image: electronuserland/builder:wine
  script:
    - cd KSol.ZeroVDI.Desktop
    - npm ci
    - npx electron-builder --linux --win
    - 'curl --fail --location --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file dist/*.exe "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/desktop-client/latest/ZeroVDI-Setup-Windows.exe"'
    - 'curl --fail --location --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file dist/*.AppImage "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/desktop-client/latest/ZeroVDI-Linux.AppImage"'

build_desktop_macos:
  stage: build
  rules:
    - changes:
        - KSol.ZeroVDI.Desktop/**/*
  tags:
    - shell
    - macos
  script:
    - cd KSol.ZeroVDI.Desktop
    - npm ci
    - npx electron-builder --mac
    - 'curl --fail --location --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file dist/*.dmg "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/desktop-client/latest/ZeroVDI-macOS.dmg"'

# Shared deploy logic. Prod and dev run as two isolated compose projects on the
# same host: distinct project names give each its own pgdata + keys volumes, so
# the ES256 signing key is generated once per environment and persisted across
# redeploys. The key never leaves the server (no key material in CI variables).
.deploy_template: &deploy_template
  needs:
    - build_amd64_image
    - build_connector_image
  stage: deploy
  allow_failure: false
  tags:
    - docker
    - prod
    - no-gpu
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - export APP_IMAGE=$CI_REGISTRY_IMAGE:latest
    - export CONNECTOR_IMAGE=$CI_REGISTRY_IMAGE/connector:latest
    - export COMPOSE_PROJECT="zerovdi"
    - export STACK_NAME="$COMPOSE_PROJECT"
    # Connector enrollment from PROTECTED/MASKED GitLab CI/CD variables (per environment). Supply
    # ZEROVDI_URL plus either ZEROVDI_AUTH_TOKEN (stateless) or ZEROVDI_REGISTRATION_TOKEN (first-boot
    # enroll, persisted to the /mnt/data/zerovdi-connector volume). Exported so compose passes them through.
    - export ZEROVDI_URL="$ZEROVDI_URL"
    - export ZEROVDI_AUTH_TOKEN="$ZEROVDI_AUTH_TOKEN"
    - export ZEROVDI_REGISTRATION_TOKEN="$ZEROVDI_REGISTRATION_TOKEN"
    # Credential-keyring passphrase (encrypts stored VM/IPMI/SSH secrets + the NTLM NtHash at rest).
    # Supplied as a PROTECTED, MASKED GitLab CI/CD variable per environment; never committed. Exported
    # so the compose file passes it through to the container as DataProtection__MasterKeyPassphrase.
    # The app refuses to start in Production if it is unset.
    - 'if [ -z "$DataProtection__MasterKeyPassphrase" ]; then echo "ERROR: DataProtection__MasterKeyPassphrase CI/CD variable is not set"; exit 1; fi'
    - export DataProtection__MasterKeyPassphrase="$DataProtection__MasterKeyPassphrase"
    - docker compose -p $COMPOSE_PROJECT pull ksol-zerovdi-app ksol-zerovdi-connector || true
    - docker compose -p $COMPOSE_PROJECT up -d --remove-orphans
    - docker image prune -af

deploy_production:
  <<: *deploy_template
  only:
    - main
  environment:
    name: prod
  variables:
    DEPLOY_ENV: prod
    ASPNETCORE_ENVIRONMENT: Production
    # POSTGRES_PASSWORD is provided as a protected CI/CD variable (scoped to prod).