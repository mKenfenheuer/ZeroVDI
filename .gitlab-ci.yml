before_script:
  - export CI_ENVIRONMENT_HOST=$(echo $CI_ENVIRONMENT_URL | sed 's~http[s]*://~~g')

stages:
 - build
 - deploy

build_amd64_image:
  stage: build
  needs:
    - build_desktop_windows_linux
    - build_desktop_macos
  tags:
    - docker
    - build
    - shell
  script:
    # Bundle the desktop client installers into the image so the dashboard can offer them for
    # direct download — staged into wwwroot/downloads before build so `dotnet publish` picks them
    # up as static content, same as any other wwwroot asset.
    - mkdir -p KSol.ZeroVDI/wwwroot/downloads
    - cp KSol.ZeroVDI.Desktop/dist/*.exe KSol.ZeroVDI/wwwroot/downloads/ZeroVDI-Setup-Windows.exe
    - cp KSol.ZeroVDI.Desktop/dist/*.AppImage KSol.ZeroVDI/wwwroot/downloads/ZeroVDI-Linux.AppImage
    - cp KSol.ZeroVDI.Desktop/dist/*.dmg KSol.ZeroVDI/wwwroot/downloads/ZeroVDI-macOS.dmg
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $CI_COMMIT_BRANCH .
    - docker image tag $CI_COMMIT_BRANCH $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker image push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker image prune -a

# ZeroVDI connector agent image, published under the /connector path of the registry so it versions
# alongside the gateway (same short-SHA tag).
build_connector_image:
  stage: build
  tags:
    - docker
    - build
    - shell
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -f KSol.ZeroVDI.Connector/Dockerfile -t $CI_REGISTRY_IMAGE/connector:$CI_COMMIT_SHORT_SHA .
    - docker image push $CI_REGISTRY_IMAGE/connector:$CI_COMMIT_SHORT_SHA
    - docker image prune -a

# Desktop client (Electron wrapper around the web console). Windows and Linux targets are built
# cross-platform via electron-builder on the existing Linux runner; macOS needs Apple's own
# tooling (codesign/hdiutil) so it runs on the macOS runner instead. Artifacts are kept as GitLab
# job artifacts rather than pushed anywhere — pull them from the pipeline until a release process
# for the desktop client exists.
build_desktop_windows_linux:
  stage: build
  tags:
    - docker
    - build
    - dind
  image: electronuserland/builder:wine
  script:
    - cd KSol.ZeroVDI.Desktop
    - npm ci
    - npx electron-builder --linux --win
  artifacts:
    paths:
      - KSol.ZeroVDI.Desktop/dist/*.AppImage
      - KSol.ZeroVDI.Desktop/dist/*.exe
    expire_in: 30 days

build_desktop_macos:
  stage: build
  tags:
    - shell
    - macos
  script:
    - cd KSol.ZeroVDI.Desktop
    - npm ci
    - npx electron-builder --mac
  artifacts:
    paths:
      - KSol.ZeroVDI.Desktop/dist/*.dmg
    expire_in: 30 days

# Shared deploy logic. Prod and dev run as two isolated compose projects on the
# same host: distinct project names give each its own pgdata + keys volumes, so
# the ES256 signing key is generated once per environment and persisted across
# redeploys. The key never leaves the server (no key material in CI variables).
.deploy_template: &deploy_template
  needs:
    - build_amd64_image
    - build_connector_image
  stage: deploy
  allow_failure: false
  tags:
    - docker
    - prod
    - no-gpu
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - export APP_IMAGE=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - export CONNECTOR_IMAGE=$CI_REGISTRY_IMAGE/connector:$CI_COMMIT_SHORT_SHA
    - export COMPOSE_PROJECT="zerovdi"
    - export STACK_NAME="$COMPOSE_PROJECT"
    # Connector enrollment from PROTECTED/MASKED GitLab CI/CD variables (per environment). Supply
    # ZEROVDI_URL plus either ZEROVDI_AUTH_TOKEN (stateless) or ZEROVDI_REGISTRATION_TOKEN (first-boot
    # enroll, persisted to the /mnt/data/zerovdi-connector volume). Exported so compose passes them through.
    - export ZEROVDI_URL="$ZEROVDI_URL"
    - export ZEROVDI_AUTH_TOKEN="$ZEROVDI_AUTH_TOKEN"
    - export ZEROVDI_REGISTRATION_TOKEN="$ZEROVDI_REGISTRATION_TOKEN"
    # Credential-keyring passphrase (encrypts stored VM/IPMI/SSH secrets + the NTLM NtHash at rest).
    # Supplied as a PROTECTED, MASKED GitLab CI/CD variable per environment; never committed. Exported
    # so the compose file passes it through to the container as DataProtection__MasterKeyPassphrase.
    # The app refuses to start in Production if it is unset.
    - 'if [ -z "$DataProtection__MasterKeyPassphrase" ]; then echo "ERROR: DataProtection__MasterKeyPassphrase CI/CD variable is not set"; exit 1; fi'
    - export DataProtection__MasterKeyPassphrase="$DataProtection__MasterKeyPassphrase"
    - docker compose -p $COMPOSE_PROJECT pull ksol-zerovdi-app ksol-zerovdi-connector || true
    - docker compose -p $COMPOSE_PROJECT up -d --remove-orphans
    - docker image prune -af

deploy_production:
  <<: *deploy_template
  only:
    - main
  environment:
    name: prod
  variables:
    DEPLOY_ENV: prod
    ASPNETCORE_ENVIRONMENT: Production
    # POSTGRES_PASSWORD is provided as a protected CI/CD variable (scoped to prod).