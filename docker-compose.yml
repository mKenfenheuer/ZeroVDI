# ZeroVDI — reference stack.
#
# Quick start:
#   1. cp .env.example .env   and set at least DataProtection__MasterKeyPassphrase and App__PublicBaseUrl
#   2. docker compose up -d
#   3. docker compose logs ksol-zerovdi-app | grep "Bootstrapped initial admin"
#
# Put a TLS-terminating reverse proxy in front of this (nginx, Caddy, Traefik) and forward the
# Upgrade/Connection headers — the console relay is a WebSocket.

services:
  ksol-zerovdi-app:
    container_name: "ksol-zerovdi-app"
    image: ${APP_IMAGE:-ghcr.io/mkenfenheuer/ksol-zerovdi:latest}
    restart: "unless-stopped"
    ports:
      - "${ZEROVDI_PORT:-8080}:8080"
    environment:
      - "ASPNETCORE_ENVIRONMENT=Production"
      # REQUIRED in production: encrypts the credential keyring at rest (stored VM/IPMI/SSH secrets).
      # The app refuses to start without it. Back it up — losing it makes every stored credential and
      # every encrypted recording unrecoverable.
      - "DataProtection__MasterKeyPassphrase=${DataProtection__MasterKeyPassphrase:?set this in .env}"
      # The address users reach ZeroVDI on. Password-reset / e-mail-change links and the OpenID Connect
      # redirect URI are built from it instead of the request's Host header, which a forged request
      # could otherwise point at someone else's site.
      - "App__PublicBaseUrl=${App__PublicBaseUrl:-}"
      - "AllowedHosts=${AllowedHosts:-*}"
      # Optional: pin the first administrator. Without a password one is generated and logged once.
      - "Bootstrap__AdminEmail=${Bootstrap__AdminEmail:-admin@example.com}"
      - "Bootstrap__AdminPassword=${Bootstrap__AdminPassword:-}"
      # Behind a reverse proxy, name it here so the audit log and rate limiting see real client IPs.
      - "ForwardedHeaders__KnownProxies=${ForwardedHeaders__KnownProxies:-}"
    volumes:
      # The SQLite database, the DataProtection keyring and the session recordings. Back this up.
      # The container runs as UID 1654; a host bind mount must be owned by it
      # (chown -R 1654:1654 /path), a named volume like this one needs nothing.
      - "zerovdi-data:/app/Data"
    security_opt:
      # A compromised process must not be able to gain privileges through a setuid binary.
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      # The resource status probe pings hosts, and ICMP from .NET needs a raw socket. Everything else
      # the gateway does is ordinary TCP/UDP.
      - NET_RAW
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

    # --- Wake-on-LAN ------------------------------------------------------------------------------
    # Waking a physical machine sends a broadcast to 255.255.255.255, which a bridged container
    # network traps in its own subnet. If you publish physical hosts and want WoL, replace the `ports`
    # block above with host networking and set ASPNETCORE_HTTP_PORTS to the port you want to bind:
    #
    #   network_mode: "host"
    #   environment:
    #     - "ASPNETCORE_HTTP_PORTS=8080"
    #
    # Everything else, including the health check, stays as it is.

  # Optional. Deploy one connector near any network the gateway cannot reach directly; it holds an
  # outbound WebSocket to the gateway and tunnels desktop connections back through it. Remove this
  # service entirely if every desktop is directly reachable.
  ksol-zerovdi-connector:
    container_name: "ksol-zerovdi-connector"
    image: ${CONNECTOR_IMAGE:-ghcr.io/mkenfenheuer/ksol-zerovdi/connector:latest}
    restart: "unless-stopped"
    profiles: ["connector"]
    environment:
      - "ASPNETCORE_ENVIRONMENT=Production"
      # The gateway's base URL, plus ONE of:
      #   ZEROVDI_AUTH_TOKEN          a long-lived token — fully stateless, no volume needed
      #   ZEROVDI_REGISTRATION_TOKEN  a one-time token from Admin -> Connectors — self-enrols on first
      #                               boot and persists the result to the volume below
      - "ZEROVDI_URL=${ZEROVDI_URL:-}"
      - "ZEROVDI_AUTH_TOKEN=${ZEROVDI_AUTH_TOKEN:-}"
      - "ZEROVDI_REGISTRATION_TOKEN=${ZEROVDI_REGISTRATION_TOKEN:-}"
    volumes:
      - "zerovdi-connector-data:/data"
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  zerovdi-data:
  zerovdi-connector-data:
