services:
  ksol-zerovdi-app:
    container_name: "ksol-zerovdi-app"
    environment:
      - "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      - "APP_UID=1654"
      - "ASPNETCORE_HTTP_PORTS=80"
      - "DOTNET_RUNNING_IN_CONTAINER=true"
      - "DOTNET_VERSION=9.0.3"
      - "ASPNET_VERSION=9.0.3"
      - "ASPNETCORE_ENVIRONMENT=Production"
      # Encrypts the credential keyring at rest (stored VM/IPMI/SSH secrets + the NTLM NtHash). Sourced
      # from the DataProtection__MasterKeyPassphrase GitLab CI/CD variable, exported by the deploy job.
      # The app refuses to start in Production if this is empty.
      - "DataProtection__MasterKeyPassphrase=${DataProtection__MasterKeyPassphrase}"
    image: ${APP_IMAGE}
    ports:
      - "0.0.0.0:8084:80/tcp"
    restart: "always"
    volumes:
      - "/mnt/data/rdpgw:/app/Data"

  ksol-zerovdi-connector:
    container_name: "ksol-zerovdi-connector"
    image: ${CONNECTOR_IMAGE}
    environment:
      - "ASPNETCORE_ENVIRONMENT=Production"
      # Gateway URL and enrollment come from GitLab CI/CD variables (exported by the deploy job).
      # Supply either ZEROVDI_AUTH_TOKEN (stateless) or ZEROVDI_REGISTRATION_TOKEN (self-enrolls on
      # first boot and persists to the mounted volume).
      - "ZEROVDI_URL=${ZEROVDI_URL}"
      - "ZEROVDI_AUTH_TOKEN=${ZEROVDI_AUTH_TOKEN}"
      - "ZEROVDI_REGISTRATION_TOKEN=${ZEROVDI_REGISTRATION_TOKEN}"
    restart: "always"
    volumes:
      - "/mnt/data/rdpgw-connector:/data"