name: Container images

# Publishes the two runtime images to the GitHub Container Registry:
#   ghcr.io/<owner>/<repo>            the ZeroVDI gateway
#   ghcr.io/<owner>/<repo>/connector  the connector agent
#
# Pull requests build the images but never push them, so a change can be proven to build without
# anyone being able to publish from a fork.

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Gate the images on a green build and test run: an image that is published and signed but does not
  # compile cleanly is worse than no image, because the signature says someone vouched for it.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          # Gateway on net9.0, connector agent on net10.0.
          dotnet-version: |
            9.0.x
            10.0.x
      - run: dotnet test KSol.ZeroVDI.sln -c Release -p:SkipTailwindBuild=true

  gateway:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Used to complete the identity challenge with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The console offers the desktop client from /downloads. The installers are built and released
      # by desktop-release.yml; fetch the newest published ones so every gateway image can serve them,
      # independently of whether this run touched the desktop client. Absent (e.g. before the first
      # desktop release) is not an error — the dashboard simply has nothing to offer.
      - name: Stage desktop client installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p KSol.ZeroVDI/wwwroot/downloads
          tag=$(gh release list --limit 20 --json tagName,isDraft \
                  --jq 'map(select(.isDraft | not)) | .[0].tagName // empty' 2>/dev/null || true)
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "No release found; the image will ship without desktop installers."
            exit 0
          fi
          echo "Staging desktop installers from release $tag"
          gh release download "$tag" --dir KSol.ZeroVDI/wwwroot/downloads \
            --pattern 'ZeroVDI-Setup-Windows.exe' \
            --pattern 'ZeroVDI-macOS.dmg' \
            --pattern 'ZeroVDI-Linux.AppImage' --clobber || \
            echo "Release $tag carries no desktop installers; continuing."
          ls -la KSol.ZeroVDI/wwwroot/downloads || true

      # Set up BuildKit so multi-platform builds and registry cache export work.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 # v3.5.0
        with:
          cosign-release: 'v2.2.4'

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # main → :main and :latest; a v1.2.3 tag → :1.2.3, :1.2 and :latest.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push gateway image
        id: build-and-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

      # Signing uses the identity token to provision an ephemeral certificate against the sigstore
      # community Fulcio instance; this writes to the public Rekor transparency log.
      - name: Sign the published image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

  connector:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 # v3.5.0
        with:
          cosign-release: 'v2.2.4'

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/connector
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push connector image
        id: build-and-push
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          file: KSol.ZeroVDI.Connector/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=connector
          cache-to: type=gha,mode=max,scope=connector

      - name: Sign the published image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
